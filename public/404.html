.code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-size:28px;line-height:1.2;letter-spacing:-.035em;font-weight:600;margin:0 0 13px}
p{color:var(--muted);margin:0 0 21px}
a{display:inline-flex;align-items:center;height:40px;padding:0 16px;border:1px solid var(--line);border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
a:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
</style>
